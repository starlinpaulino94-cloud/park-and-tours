name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR is not healthy if build or tests fail.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: @supabase/supabase-js deprecó Node 20 y su cliente Realtime
          # exige WebSocket nativo (ausente en Node 20), lo que hacía fallar el
          # global-setup del E2E al construir el cliente con service-role.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time only; runtime secrets are injected by the hosting platform.
          NEXT_TELEMETRY_DISABLED: "1"
          DISABLE_OPENNEXT: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E — Mi día responsive
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USE_RLS: ${{ secrets.SUPABASE_USE_RLS }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Guard — service role key never in client bundle
        run: |
          if grep -rn "SUPABASE_SERVICE_ROLE_KEY" src/ 2>/dev/null | grep -v "server-only\|process.env" | grep -iE "NEXT_PUBLIC|client"; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY must never be exposed to the client"; exit 1
          fi
          echo "OK: no service role key exposure detected"
