name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR is not healthy if build or tests fail.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: @supabase/supabase-js deprecó Node 20 y su cliente Realtime
          # exige WebSocket nativo (ausente en Node 20), lo que hacía fallar el
          # global-setup del E2E al construir el cliente con service-role.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ══════════════════════════════════════════════════════════════════════
      # EL E2E CORRE CONTRA SU PROPIA BASE, NO CONTRA LA DE VERDAD (CI-001)
      #
      # Hasta aquí, este paso recibía la URL y la LLAVE DE SERVICIO del proyecto
      # de producción. Cada pull request creaba y mantenía la empresa
      # `e2e-tenant` en la base real y reescribía la contraseña de la cuenta de
      # pruebas. Eso ya causó un incidente: una cuenta que una persona usaba
      # dejó de dejarle entrar, en silencio, porque alguien abrió un PR.
      #
      # Acotarlo con cuidado no arregla la categoría del problema. Mientras el
      # CI tenga una llave de servicio sobre la operación de verdad, cualquier
      # fallo escribe en los datos del negocio, y de ahí no se vuelve con un
      # `git revert`. La única forma de que no pueda pasar es que el CI no tenga
      # con qué.
      #
      # Ahora cada corrida levanta su propia pila, aplica las migraciones desde
      # cero y se la lleva la basura al terminar. De regalo, el E2E prueba
      # TAMBIÉN que las migraciones levantan un sistema utilizable desde cero,
      # que antes no lo comprobaba nadie.
      # ══════════════════════════════════════════════════════════════════════
      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar Supabase local (migraciones desde cero)
        run: supabase start

      # Las llaves las genera la CLI al arrancar. NO son secretos: solo abren
      # unos contenedores que viven lo que dura este job. Se leen aquí en vez de
      # copiarlas a mano para que no haya que tocar este fichero cuando la CLI
      # cambie de llaves.
      # `-o env` emite `CLAVE="valor"`. En $GITHUB_ENV las comillas viajarían
      # DENTRO del valor, así que la URL acabaría siendo `"http://…"` con
      # comillas y nada conectaría. Se quitan aquí.
      - name: Tomar las llaves de la pila local
        run: supabase status -o env | tr -d '"' >> "$GITHUB_ENV"

      # EL BUILD VA AQUÍ, Y NO ANTES, POR UNA RAZÓN QUE NO SE VE.
      #
      # Las variables `NEXT_PUBLIC_*` no se leen en tiempo de ejecución: Next las
      # INCRUSTA en el paquete del navegador al compilar. Compilando antes con la
      # URL de producción, el navegador del E2E habría iniciado sesión contra
      # producción por mucho que el servidor tuviera la local en su entorno —el
      # cambio entero no habría servido de nada, y en silencio.
      #
      # Compilando aquí, lo que el navegador lleva dentro es la pila local.
      - name: Build (con la pila local incrustada)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DISABLE_OPENNEXT: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3100

      - name: E2E contra la pila local
        run: npm run test:e2e
        env:
          # Una cuenta inventada, en una base que se destruye en unos minutos.
          # No hay secreto que filtrar ni cuenta de nadie que pisar.
          E2E_EMAIL: e2e@e2e.invalid
          E2E_PASSWORD: e2e-local-only-password
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          # En true a propósito: el E2E tiene que ejercitar las MISMAS políticas
          # que corren en producción. Con la RLS apagada, el CI daría por buenas
          # consultas que allí devuelven vacío.
          SUPABASE_USE_RLS: "true"
          NEXT_PUBLIC_APP_URL: http://localhost:3100

      - name: Apagar Supabase local
        if: always()
        run: supabase stop --no-backup

      # QUÉ HABÍA EN LA PANTALLA CUANDO FALLÓ.
      #
      # Un E2E de login en rojo deja en el registro «waitForURL: Timeout 60000ms»
      # y nada más. Eso no distingue las tres causas posibles —el formulario
      # mostró un error, la sesión no se creó, o /dashboard tardó más de un
      # minuto en responder— y cada una se arregla en un sitio distinto. El
      # `error-context.md` que Playwright escribe al fallar es el árbol de
      # accesibilidad de la página en ese instante: si hay un mensaje de error en
      # el formulario, sale ahí con su texto.
      #
      # SOLO ESE FICHERO, Y NO EL TRACE. El trace (`trace.zip`) graba las
      # peticiones con su cuerpo: dentro va el POST de inicio de sesión con
      # E2E_PASSWORD en claro y el token de acceso que devuelve. Subirlo como
      # artefacto convertiría un secreto del repositorio en un fichero
      # descargable, y el token viajaría vivo. El árbol de accesibilidad no lleva
      # red: es texto de la pantalla.
      - name: Qué se veía al fallar el E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-error-context
          path: test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore

      # Las pruebas de esquema (dominios, cascadas, aislamiento entre inquilinos)
      # se escribieron contra Postgres de verdad y hasta ahora solo corrían si
      # alguien se acordaba de lanzarlas a mano. Un `check` que no se ejecuta no
      # protege nada: una migración podía romper el aislamiento y llegar a main.
      # El script levanta su propio cluster efímero; no toca ninguna base remota.
      - name: Pruebas de base de datos
        run: bash scripts/db-test.sh

      # ══════════════════════════════════════════════════════════════════════
      # SIMULACRO DE RESTAURACIÓN (DR-001)
      #
      # «Supabase hace copias; que se pueda volver de una no lo ha verificado
      # nadie.» La parte cara no es si el volcado se restaura —eso casi siempre
      # funciona— sino si lo que queda DESPUÉS sirve: aquí una base restaurada a
      # medias no da un solo error, devuelve cero filas a todo el mundo.
      #
      # El simulacro vuelca, DESTRUYE, restaura y comprueba con el mismo script
      # que se pega en el editor tras una restauración de verdad. Y después
      # rompe la base cuatro veces a propósito para verificar que la
      # comprobación sabe fallar: una verificación que no puede fallar no
      # verifica nada, y así es como un plan de recuperación se pudre sin que
      # nadie lo note.
      # ══════════════════════════════════════════════════════════════════════
      - name: Simulacro de restauración
        run: bash scripts/restore-drill.sh

      - name: Guard — service role key never in client bundle
        run: |
          if grep -rn "SUPABASE_SERVICE_ROLE_KEY" src/ 2>/dev/null | grep -v "server-only\|process.env" | grep -iE "NEXT_PUBLIC|client"; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY must never be exposed to the client"; exit 1
          fi
          echo "OK: no service role key exposure detected"
